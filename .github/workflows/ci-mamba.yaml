# Basic Mamba CI pipeline on top of CCTBX

name: CI pipeline on Mamba

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # run daily to ensure that changes to dependenices are not breaking tests
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

env:
  # MOPAC_COMMAND: $CONDA_PREFIX/bin/mopac
  # XTBHOME: $CONDA_PREFIX
  PY: "python3.12"
  #CLEANUP_TESTS: 'FALSE'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -leo pipefail {0} {0}

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: df
        run: df -h

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yaml
          cache-environment: false
          environment-name: qrefine-ci-mamba
          post-cleanup: all

      - name: run installer
        run: |
          sh build_into_conda.sh

      - name: smoke test
        run: |
          source $CONDA_PREFIX/lib/$PY/site-packages/build/setpaths.sh
          qr.refine --help
          env

      - name: qr.test
        run: |
          cd  /home/runner/work/qrefine/qrefine/
          pwd
          mkdir testing_workdir
          cd testing_workdir
          source $CONDA_PREFIX/lib/$PY/site-packages/build/setpaths.sh
          qr.test | tee ../qr_test.txt

      - name: check tests and testing_workdir
        id: check_tests
        if: always()
        run: |
         ls -R
         failed_names=$(awk '/^FAILED tests:$/{flag=1; next} /^====/{flag=0} flag' ../qr_test.txt | awk '{print $1}')
         if [ -n "$failed_names" ]; then
           echo "$failed_names" | awk 'BEGIN{print "The following tests FAILED:"} {print " * "$1}' >> $GITHUB_STEP_SUMMARY
         fi
         {
           echo "failed_tests<<EOF"
           if [ -n "$failed_names" ]; then
             echo "$failed_names" | sed 's/^/ * /'
           fi
           echo "EOF"
         } >> "$GITHUB_OUTPUT"
        working-directory: /home/runner/work/qrefine/qrefine/testing_workdir

      - name: Archive qr test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qr-test-output
          path: ./qr_test.txt

      - name: Archive qr-log files output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-dir
          path: /home/runner/work/qrefine/qrefine/testing_workdir

      - name: Report Status
        if: always()
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          notify_when: 'failure'
          message_format: '{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}@{branch}> on <{commit_url}|{commit_sha}>\n${{ steps.check_tests.outputs.failed_tests }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}
